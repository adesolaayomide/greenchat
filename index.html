<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#075e54" />
  <title>GreenChat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='8' fill='%2325d366'/></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- Chat list screen -->
    <section class="screen list-screen" id="listScreen">
      <header class="topbar">
        <h1>GreenChat</h1>
        <div class="top-actions">
          <button class="icon-btn" id="themeBtn" title="Toggle light/dark mode" aria-label="Toggle theme">
            <span id="themeIcon">🌙</span>
          </button>
        </div>
      </header>
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="Search chats" />
      </div>
      <ul class="chat-list" id="chatList"></ul>
    </section>

    <!-- Conversation screen -->
    <section class="screen chat-screen" id="chatScreen" hidden>
      <header class="chat-header">
        <button class="icon-btn back-btn" id="backBtn" aria-label="Back">‹</button>
        <div class="avatar" id="chatAvatar"></div>
        <div class="chat-title">
          <div class="chat-name" id="chatName"></div>
          <div class="chat-status" id="chatStatus"></div>
        </div>
      </header>
      <div class="messages" id="messages"></div>
      <form class="composer" id="composer" autocomplete="off">
        <input id="msgInput" type="text" placeholder="Message" />
        <button type="submit" class="send-btn" aria-label="Send">➤</button>
      </form>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
